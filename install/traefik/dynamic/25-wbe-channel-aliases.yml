{
  "http": {
    "routers": {
      "wbe-channel-slugs": {
        "rule": "Host(`wbe.kronosfinance.it`) && PathRegexp(`^/[a-z0-9]+(-[a-z0-9]+)*/(report/?|admin(/.*)?|login(/.*)?)$`) && !PathRegexp(`^/(api|s|js|css|fonts|workers|l10n)(/|$)`)",
        "entryPoints": [
          "websecure"
        ],
        "priority": 200,
        "service": "wbe-kronosfinance-https",
        "tls": {
          "certResolver": "letsencrypt",
          "options": "modern-tls"
        },
        "middlewares": [
          "default-headers",
          "security-headers",
          "compression",
          "rate-limit-standard",
          "wbe-channel-document"
        ]
      }
    },
    "middlewares": {
      "wbe-channel-document": {
        "replacePath": {
          "path": "/"
        }
      }
    }
  }
}
